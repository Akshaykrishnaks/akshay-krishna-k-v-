<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9"/>
      <stop offset="50%" stop-color="#E2ECE4"/>
      <stop offset="100%" stop-color="#EAE5DC"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FA892"/>
      <stop offset="100%" stop-color="#648168"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="600" height="750" fill="url(#bgGrad)" />

  <!-- Soft organic backdrop shapes -->
  <circle cx="480" cy="180" r="140" fill="#8FA892" opacity="0.18" />
  <circle cx="120" cy="520" r="160" fill="#D9A5A0" opacity="0.12" />
  <path d="M50,150 Q120,40 260,100 T450,120 Q550,220 500,380 T320,580 Q100,560 60,380 Z" fill="#FFFFFF" opacity="0.4" />

  <!-- Botanical Leaf Accents in soft sage -->
  <g stroke="#8FA892" stroke-width="2.5" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M420,120 Q460,70 510,80 Q480,120 420,120" fill="#8FA892" fill-opacity="0.1" />
    <path d="M440,105 Q470,80 500,85" />
    <path d="M470,160 Q520,130 550,160 Q510,180 470,160" fill="#8FA892" fill-opacity="0.1" />
    <path d="M90,620 Q50,560 70,500 Q120,530 90,620" fill="#8FA892" fill-opacity="0.15" />
    <path d="M80,560 Q65,530 75,510" />
  </g>

  <!-- Elegant Stylized Portrait Illustration / Silhouette -->
  <g transform="translate(150, 160)">
    <!-- Shoulders & Coat / Blazer -->
    <path d="M-40,440 C-30,340 30,300 80,280 L120,330 L180,330 L220,280 C270,300 330,340 340,440 Z" fill="#2B2B2B" opacity="0.88" />
    <!-- Shirt Collar & V-Neck -->
    <path d="M80,280 L150,370 L220,280 L180,270 L150,310 L120,270 Z" fill="#FFFFFF" />
    <!-- Neck -->
    <rect x="122" y="210" width="56" height="85" rx="10" fill="#E8D7CA" />
    <path d="M122,250 C140,265 160,265 178,250 L178,295 L122,295 Z" fill="#DECAA9" opacity="0.4" />

    <!-- Head / Face -->
    <ellipse cx="150" cy="180" rx="68" ry="82" fill="#F0DFC8" />
    
    <!-- Ears -->
    <ellipse cx="78" cy="185" rx="10" ry="16" fill="#E8D7CA" />
    <ellipse cx="222" cy="185" rx="10" ry="16" fill="#E8D7CA" />

    <!-- Modern Haircut -->
    <path d="M75,170 C70,120 100,70 150,65 C205,70 230,110 225,170 C215,130 200,105 150,105 C100,105 85,130 75,170 Z" fill="#2B2B2B" />
    <path d="M85,130 C120,75 180,75 220,110 C190,85 140,85 95,115 Z" fill="#3D3D3A" />

    <!-- Minimalist Glasses -->
    <rect x="95" y="155" width="46" height="32" rx="10" fill="none" stroke="#2B2B2B" stroke-width="4" />
    <rect x="159" y="155" width="46" height="32" rx="10" fill="none" stroke="#2B2B2B" stroke-width="4" />
    <line x1="141" y1="170" x2="159" y2="170" stroke="#2B2B2B" stroke-width="4" />
    <line x1="84" y1="165" x2="95" y2="168" stroke="#2B2B2B" stroke-width="3" />
    <line x1="205" y1="168" x2="216" y2="165" stroke="#2B2B2B" stroke-width="3" />
    
    <!-- Eyebrows & Eyes -->
    <path d="M98,145 Q118,140 138,148" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M162,148 Q182,140 202,145" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle cx="118" cy="170" r="4.5" fill="#2B2B2B" />
    <circle cx="182" cy="170" r="4.5" fill="#2B2B2B" />

    <!-- Nose & Warm Confident Smile -->
    <path d="M150,168 L147,192 L155,195" stroke="#D1B8A5" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M136,215 Q150,228 164,215" stroke="#2B2B2B" stroke-width="3.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Soft Badge Overlay at Bottom -->
  <g transform="translate(80, 640)">
    <rect width="440" height="70" rx="35" fill="#FFFFFF" opacity="0.95" filter="url(#softGlow)" stroke="#8FA892" stroke-width="1.5" />
    <!-- Camera Icon -->
    <g transform="translate(25, 20)">
      <circle cx="15" cy="15" r="14" fill="#E2ECE4" />
      <path d="M9,18 L11,13 L19,13 L21,18 Z" fill="#648168" />
      <circle cx="15" cy="18" r="4" fill="#648168" />
    </g>
    <!-- Text instructions -->
    <text x="68" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#2B2B2B">
      Akshay Krishna K S
    </text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#648168">
      Replace with your photo in public/profile.jpg
    </text>
  </g>
</svg>

